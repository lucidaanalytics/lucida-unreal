name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Always runs: the plugin wraps the engine-free header-only C++ core, so this validates the .uplugin manifest
      # and compiles that core the way Unreal does.
      - name: Plugin manifest
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open("Lucida.uplugin"))
          assert p["VersionName"] and p["Modules"], "Lucida.uplugin needs VersionName and Modules"
          assert os.path.isfile("Source/Lucida/ThirdParty/include/lucida/lucida.hpp"), "vendored C++ core is missing"
          PY
      - name: Compile the vendored core (no exceptions, no RTTI)
        run: |
          echo '#include "lucida/lucida.hpp"' > /tmp/check.cpp
          clang++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror -fno-exceptions -fno-rtti -ISource/Lucida/ThirdParty/include /tmp/check.cpp

  # The real engine: BuildPlugin (Editor + Game targets for Linux) in Epic's container, then the plugin's automation
  # tests headless. The image is private to the EpicGames GitHub org: add GHCR_EPIC_TOKEN (a classic PAT with
  # read:packages from an account in that org) and, when that account is not the pusher, GHCR_EPIC_USER.
  # The steps run under `docker run` (not a job container) so the runner can free disk for the ~20 GB image first,
  # and so the job can skip with a notice when the secret is absent.
  engine:
    runs-on: ubuntu-latest
    env:
      GHCR_EPIC_TOKEN: ${{ secrets.GHCR_EPIC_TOKEN }}
      GHCR_EPIC_USER: ${{ secrets.GHCR_EPIC_USER || github.actor }}
      UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.4
    steps:
      - name: Epic container access
        id: gate
        run: |
          if [ -z "$GHCR_EPIC_TOKEN" ]; then
            echo "::notice title=Unreal Engine build skipped::add the GHCR_EPIC_TOKEN secret (see README, Epic GitHub access) to build the plugin with the engine"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Lucida
      - name: Free disk for the engine image
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune -af
          df -h /
      - name: Pull the engine
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "$GHCR_EPIC_TOKEN" | docker login ghcr.io -u "$GHCR_EPIC_USER" --password-stdin
          docker pull "$UE_IMAGE"
      - name: BuildPlugin and automation tests
        if: steps.gate.outputs.run == 'true'
        run: |
          chmod -R a+rwX Lucida
          docker run --rm -v "$PWD/Lucida:/src/Lucida:ro" "$UE_IMAGE" bash -euo pipefail -c '
            UE=/home/ue4/UnrealEngine
            "$UE/Engine/Build/BatchFiles/RunUAT.sh" BuildPlugin -Plugin=/src/Lucida/Lucida.uplugin -Package=/tmp/pkg/Lucida -TargetPlatforms=Linux
            mkdir -p /tmp/proj/Plugins
            cp -r /tmp/pkg/Lucida /tmp/proj/Plugins/Lucida
            printf "%s" "{\"FileVersion\":3,\"EngineAssociation\":\"\",\"Plugins\":[{\"Name\":\"Lucida\",\"Enabled\":true}]}" > /tmp/proj/Ci.uproject
            "$UE/Engine/Binaries/Linux/UnrealEditor-Cmd" /tmp/proj/Ci.uproject -ExecCmds="Automation RunTests Lucida;Quit" \
              -unattended -nullrhi -nopause -nosplash -nosound -stdout -abslog=/tmp/auto.log || true
            grep "Test Completed" /tmp/auto.log || true
            grep -q "Result={Success}" /tmp/auto.log
            ! grep -q "Result={Fail" /tmp/auto.log
          '
